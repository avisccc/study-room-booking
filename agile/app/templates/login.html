<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>討論室預約系統</title>
</head>
<body>
    <h1>討論室預約系統</h1>
    <h2>使用者登入</h2>

    
<form method="POST">
    <p>帳號：<input type="text" name="username" required></p>
    <p>密碼：<input type="password" name="password" required></p>
    <button type="submit">登入</button>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
</form>

</body>
</html>
